services:
  - type: web
    name: amazon-product-analyzer-backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
    healthCheckPath: /health
